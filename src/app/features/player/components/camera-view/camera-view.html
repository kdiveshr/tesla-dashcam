<div class="camera-container">

  <h3>
    {{ label }}
  </h3>


  @if (source) {

  

  <video
  #video
  [src]="source"
  (loadedmetadata)="onMetadataLoaded()"
  (timeupdate)="onTimeUpdate()"
  (ended)="onEnded()">
</video>



  }


  @else {

    <div class="empty">
      No video
    </div>

  }

</div>
