@if (sample) {
  <aside class="telemetry-hud" aria-label="Live vehicle telemetry">
    <div class="hud-line">
      <div class="speed-block">
        <strong>{{ speedKph ?? '—' }}</strong>
        <span>km/h</span>
      </div>

      <div class="hud-meta">
        <span class="meta-pill">{{ sample.gear?.toUpperCase() ?? 'D' }}</span>
        @if (autopilotLabel) {
          <span class="meta-pill accent">{{ autopilotLabel }}</span>
        }
        <span class="meta-pill ghost">{{ compassLabel }}</span>
        <span class="meta-pill ghost">{{ batteryPercent ?? '—' }}%</span>
      </div>

      <div class="steering-panel" aria-label="Steering visualization">
        <div class="steering-wheel" [style.transform]="steeringVisual">
          <div class="wheel-ring">
            <span class="spoke spoke-0"></span>
            <span class="spoke spoke-1"></span>
            <span class="spoke spoke-2"></span>
            <span class="spoke spoke-3"></span>
            <div class="hub"></div>
          </div>
        </div>

        <div class="signal-cluster" aria-label="Turn signals">
          <span class="signal-indicator left" [class.active]="leftSignalActive || hazardSignalActive">◀</span>
          <span class="signal-indicator right" [class.active]="rightSignalActive || hazardSignalActive">▶</span>
        </div>
      </div>
    </div>
  </aside>
}
