<section class="player">


<h2>
Tesla Player
</h2>
<app-timeline
  [currentTime]="currentTime"
  [duration]="duration"
  (seek)="seek($event)">
</app-timeline>
<div class="controls">

<button
  (click)="play()">

Play

</button>


<button
  (click)="pause()">

Pause

</button>

</div>

@if (recording && recording.segments.length > 0) {


<div class="camera-grid">


<app-camera-view
  label="Front"
  [source]="frontSegments[currentSegment]?.url"
  (ended)="nextSegment()"
  (metadataLoaded)="onCameraLoaded()"
  >
</app-camera-view>

<app-camera-view
  label="Left Repeater"
  (metadataLoaded)="onCameraLoaded()"
  [source]="leftSegments[currentSegment]?.url">
</app-camera-view>

<app-camera-view
  label="Right Repeater"
  (metadataLoaded)="onCameraLoaded()"
  [source]="rightSegments[currentSegment]?.url">
</app-camera-view>


<app-camera-view
  label="Rear"
  (metadataLoaded)="onCameraLoaded()"
  [source]="rearSegments[currentSegment]?.url">
</app-camera-view>


</div>


}


@else {

<p>
No Tesla clips loaded.
</p>

}


</section>
