<section class="player">


<header class="player-header">
  <div>
    <p class="eyebrow">EDITING STUDIO</p>
    <h1>{{ recording?.folderName ?? 'TeslaCam player' }}</h1>
  </div>
  @if (recording) {
    <span class="recording-summary">{{ recording.segments.length }} synced segments</span>
  }
</header>
<div class="studio-row">
  <app-telemetry-hud [sample]="telemetrySample" />
</div>

@if (recording && recording.segments.length > 0) {

<div class="player-stage">
  <div class="camera-grid">

    <div class="front-panel">
      <app-camera-view
        label="Front"
        [source]="frontSource"
        (ended)="nextSegment()"
        (metadataLoaded)="onCameraLoaded()"
        (timeUpdated)="onMasterTimeUpdated($event)"
      >
      </app-camera-view>
    </div>

    <app-camera-view
      label="Left Repeater"
      (metadataLoaded)="onCameraLoaded()"
      [source]="leftSource">
    </app-camera-view>

    <app-camera-view
      label="Right Repeater"
      (metadataLoaded)="onCameraLoaded()"
      [source]="rightSource">
    </app-camera-view>

    <app-camera-view
      label="Rear"
      (metadataLoaded)="onCameraLoaded()"
      [source]="rearSource">
    </app-camera-view>

  </div>

  <app-timeline
    [currentTime]="currentTime"
    [duration]="duration"
    [clips]="timelineClips"
    (seek)="seek($event)">
  </app-timeline>

  <div class="controls">
    <button class="primary-control" (click)="play()">Play</button>
    <button class="secondary-control" (click)="pause()">Pause</button>
    <button class="secondary-control" type="button" (click)="exportClip()">Export MP4</button>
  </div>

  <app-route-map [samples]="telemetrySamples" [currentTime]="currentTime" />
</div>

}


@else {

<p>
No Tesla clips loaded.
</p>

}


</section>
